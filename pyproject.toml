[project]
name = "kf-agent"
version = "0.1.0"
description = "Agentic application for user-friendly basic Kubeflow interaction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.9.1",
    "torch==2.14.1",
    "torchvision>=0.29.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "libs/*"]
